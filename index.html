<!DOCTYPE html>

<meta charset="utf-8">

<title>格砺学堂 · 华南师范大学学业互助平台</title>
<meta name="description" content="按课程找到同伴，让每一个学习难题都有回应。华南师范大学学业互助与资源共享平台。">
<link rel="stylesheet" href="styles.css?v=20261027m">
<script>
/* 首屏配色预置：#/square（或没有 hash）用学习广场那套白底配色，
   其余页面用默认配色。放在样式之后、正文之前，避免脚本加载完才切换的闪色。 */
(function () {
  var seg = String(location.hash || '').replace(/^#\/?/, '').split('/')[0] || 'square';
  if (seg === 'square') document.documentElement.classList.add('square-page');
})();
</script>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
</head>

  </button>
  <a class="brand" href="#/square">

      <strong>格砺学堂</strong>

    <input id="globalSearch" type="search" placeholder="搜索课程、问题或学习资料" autocomplete="off">
    <kbd>⌘ K</kbd>
    <button class="search-cancel" id="searchCancel" type="button">取消</button>
  </div>

  <div class="topright">
    <div class="campus" title="校区">

      石牌 · 大学城 · 南海 · 汕尾

    <button class="icon-btn" id="btnNotice" title="消息通知" aria-label="消息通知">

      <span class="dot" id="noticeDot" hidden></span>

</header>

      <span>华南师范大学</span>

        <span class="nav-count" id="navQaCount">0</span>

        <span class="ni-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.4 6.1A1.6 1.6 0 015 4.5h2.8l1.6 1.9h5.1a1.6 1.6 0 011.6 1.6v5.5a1.6 1.6 0 01-1.6 1.6H5a1.6 1.6 0 01-1.6-1.6z"/></svg></span><span class="ni-text">资源共享</span>
      </a>
      <a class="nav-item" data-page="ai" href="#/ai">
        <span class="ni-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.3 3.6l1.4 3.8 3.8 1.4-3.8 1.4-1.4 3.8-1.4-3.8L3.1 8.8l3.8-1.4z"/><path d="M14.4 11.9l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/></svg></span><span class="ni-text">AI 学习助手</span>

      <a class="nav-item" data-page="myquestions" href="#/myquestions"><span class="ni-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.6"/><path d="M8.1 8.2a1.95 1.95 0 013.8.6c0 1.3-1.9 1.4-1.9 2.6"/><path d="M10 13.6v.02"/></svg></span><span class="ni-text">我的提问</span><span class="nav-dot" id="navMyQDot" hidden></span></a>

        <span class="ni-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.5"/><path d="M10 3.5v1.9M10 14.6v1.9M4.2 10H6.1M13.9 10h1.9M5.9 5.9l1.3 1.3M12.8 12.8l1.3 1.3M14.1 5.9l-1.3 1.3M7.2 12.8l-1.3 1.3"/></svg></span><span class="ni-text">管理后台</span>

  <!-- ============ 主内容区 ============ -->
  <main class="main" id="main">
    <section class="page" id="page-square" hidden></section>
    <section class="page" id="page-qa" hidden></section>
    <section class="page" id="page-detail" hidden></section>
    <section class="page" id="page-resources" hidden></section>
    <section class="page" id="page-ai" hidden></section>
    <section class="page" id="page-favorites" hidden></section>

</div>

<div class="nav-scrim" id="navScrim"></div>
